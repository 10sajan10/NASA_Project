# Default Dallas 2036-09-15 scenario config.
#
# Two runs with the same config produce the same `config_hash` in the run
# manifest, which is the reproducibility anchor. CLI flags override these.

scenario:
  kml: Dallas.kml
  city: "Dallas TX USA"
  band: Mean
  pulse_s: 10.0
  scenario_date: "2036-09-15"
  days: 30

grid:
  radius_km: null            # null -> auto = max(200, days*8)
  max_radius_km: 600.0
  pixel_m: 100.0
  auto_expand: false

storage:
  root: data
  log_file: logs/run_epoch.log
  scratch_dir: null          # null -> $CUBE_SCRATCH or $TMPDIR

execution:
  # Backend for tile fan-out. The scheduler (Phase 2) reads this.
  #   serial  -> single-thread (debugging, small grids)
  #   thread  -> ThreadPoolExecutor (I/O-bound: Zarr/GCS reads)
  #   process -> ProcessPoolExecutor (CPU-bound: regression solves, KBDI)
  #   dask    -> dask.distributed LocalCluster
  #   slurm   -> dask_jobqueue.SLURMCluster (HPC)
  mode: serial
  max_workers: null          # null -> os.cpu_count()-1
  spill_threshold_mb: 1024   # working buffers above this go to memmap
  # Forwarded to dask cluster_kwargs when mode in (dask, slurm). Examples:
  #   slurm: { queue: notchpeak, cores: 16, memory: "64GB", walltime: "02:00:00",
  #            account: smithp-rw }
  cluster_kwargs: {}

# Scenario-specific inputs are deliberately not enumerated here.
# Add fields for the data fetchers and model adapters your scenario
# actually uses (see drivers/ and models/external_model_template.py).
# The engine reads only fields its registered producers ask for.

inputs: {}
weather: {}
fire: {}
