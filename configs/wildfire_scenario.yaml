# ---------------------------------------------------------------------------
# Wildfire cascade scenario — the simple WRF-SFIRE configuration file.
#
# Edit these knobs to configure a run. The cascade runner
# (scripts/run_cascade.py --config configs/wildfire_scenario.yaml) reads
# this, builds the cube grid, generates the nested namelist.input /
# namelist.wps, and runs the model on whatever HPC it lands on.
#
# Everything has a sensible default; a minimal file only needs `kml`.
# ---------------------------------------------------------------------------

scenario:
  kml: Dallas.kml                 # impact footprint (thermal-damage rings)
  city: "Dallas TX USA"
  band: Mean                      # thermal band: Mean / Min / Max
  center: [-96.80889, 32.77998]   # AOI centre [lon, lat]
  pulse_seconds: 10.0             # asteroid thermal pulse duration

# ---------------------------------------------------------------------------
# Domain — extent in km and the EXPLICIT nest stack.
# d02/d03 are NOT auto-derived from the impact footprint: you list the
# resolutions you want and the builder solves the WRF index arithmetic.
# ---------------------------------------------------------------------------
domain:
  extent_km: 1000                 # d01 side length (default 1000 x 1000 km)
  map_proj: lambert

  # Nest resolutions, coarsest -> finest (metres). One entry = single domain.
  #   [9000, 3000, 1000]  -> 9 km parent, 3 km nest, 1 km inner nest
  # Consecutive ratios must be integers (9000/3000=3, 3000/1000=3).
  resolutions_m: [9000, 3000, 1000]
  nest_fraction: 0.5              # each nest covers this fraction of its parent

  fire_mesh_ratio: 10             # SFIRE fire mesh on the innermost nest
                                  # (1000 m / 10 = 100 m fire cells)

  # Vertical grid
  e_vert: 45
  p_top_pa: 5000
  num_metgrid_levels: 33
  num_metgrid_soil_levels: 4

# ---------------------------------------------------------------------------
# Time
# ---------------------------------------------------------------------------
time:
  start: 2019-09-04T12:00         # UTC
  duration_days: 30               # simulation length (default 30 days)
  history_interval_min: 60        # wrfout frequency
  interval_seconds: 21600         # boundary (met_em) update cadence — 6 h
  restart_interval_min: 1440      # checkpoint every 24 h
  # time_step_s: null             # null -> auto (~6 s per km of coarsest dx)

# ---------------------------------------------------------------------------
# Fire physics
# ---------------------------------------------------------------------------
fire:
  ifire: 1                        # 1 = full SFIRE (module_fr_sfire_phys)
  fire_atm_feedback: 1.0          # fire <-> atmosphere coupling (pyroconvection)
  fire_tign_in_time: 1.0          # gridded-ignition acceptance window (s)

# ---------------------------------------------------------------------------
# Smoke / chemistry (WRF-Chem)
#   smoke: true requires a chem-enabled binary:
#     run_cascade.py --bootstrap --enable-chem   (one-time recompile)
#   On a non-chem build the &chem section is ignored.
# ---------------------------------------------------------------------------
chem:
  smoke: false                    # set true to emit smoke / PM tracers
  # chem_opt: 17                  # default when smoke=true (GOCART + fire emis)

# ---------------------------------------------------------------------------
# Execution / HPC
# ---------------------------------------------------------------------------
execution:
  hpc_profile: auto               # auto | chpc_utah | stampede3 | derecho | frontier | generic_slurm
  np: 0                           # MPI ranks (0 -> profile default)
  backend: serial                 # engine DAG backend: serial | thread | process
  use_real: true                  # real.exe (met_em) vs ideal.exe
  build_met_em: true              # run WPS (ERA5->geogrid->ungrib->metgrid) first
  submit_slurm: false             # submit wrf.exe as a SLURM batch job

# ---------------------------------------------------------------------------
# Outputs — which cube variables to materialise (drives the DAG)
# ---------------------------------------------------------------------------
outputs:
  targets: [arrival_s, fire_area, ros_max, fire_intensity, fuel_consumed]
  pixel_m: 900                    # cube (analysis) grid resolution
